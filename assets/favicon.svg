<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 1帧6秒 · 站点图标:六分之一时钟扇区 = 每 6 秒保留的 1 帧 -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#05080f" stroke="#1c2942" stroke-width="2"/>
  <!-- 表盘刻度:6 等分 -->
  <g stroke="#2a3c5e" stroke-width="3" stroke-linecap="round">
    <line x1="32" y1="10" x2="32" y2="16"/>
    <line x1="49.9" y1="20.1" x2="45.7" y2="24.3"/>
    <line x1="54" y1="32" x2="48" y2="32"/>
    <line x1="14.1" y1="20.1" x2="18.3" y2="24.3"/>
    <line x1="10" y1="32" x2="16" y2="32"/>
    <line x1="32" y1="48" x2="32" y2="54"/>
  </g>
  <!-- 亮起的 1/6 扇区(右下) -->
  <path d="M 32 32 L 45.7 39.7 A 16 16 0 0 1 32 48 Z" fill="#22d3ee"/>
  <!-- 中心点 -->
  <circle cx="32" cy="32" r="4.5" fill="#a3e635"/>
</svg>
