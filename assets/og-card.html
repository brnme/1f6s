<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>og-card</title>
<style>
  /* og:image 生成源:与站点同款设计令牌,Firefox headless 截图 1200x630 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #e6edf6;
    background-color: #05080f;
    background-image:
      linear-gradient(rgba(94,148,205,0.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(94,148,205,0.055) 1px, transparent 1px);
    background-size: 44px 44px;
    position: relative;
  }
  /* 右上角装饰光晕 */
  .glow {
    position: absolute; top: -180px; right: -120px; width: 560px; height: 560px;
    background: radial-gradient(circle, rgba(34,211,238,0.16) 0%, transparent 62%);
  }
  .wrap { position: relative; padding: 64px 72px; height: 100%; display: flex; flex-direction: column; }
  .kicker {
    font-family: "Noto Sans Mono CJK SC", Consolas, monospace;
    color: #22d3ee; font-size: 21px; letter-spacing: 5px; margin-bottom: 22px;
  }
  h1 { font-size: 88px; line-height: 1.16; font-weight: 700; }
  h1 .hl { color: #22d3ee; }
  h1 .frac { color: #a3e635; font-family: "Noto Sans Mono CJK SC", Consolas, monospace; font-size: 64px; }
  .tagline { color: #9aa8bd; font-size: 26px; margin-top: 22px; max-width: 900px; line-height: 1.6; }
  .pills { display: flex; gap: 16px; margin-top: auto; }
  .pill {
    border: 1px solid #1c2942; background: #0a101c; border-radius: 999px;
    padding: 12px 26px; font-size: 22px; color: #e6edf6;
    font-family: "Noto Sans Mono CJK SC", Consolas, monospace;
  }
  .pill b { color: #a3e635; font-weight: 700; }
  .foot {
    margin-top: 26px; color: #5c6a80; font-size: 20px;
    font-family: "Noto Sans Mono CJK SC", Consolas, monospace;
    display: flex; justify-content: space-between;
  }
  .foot .url { color: #22d3ee; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="kicker">FRAME EXTRACTION STANDARD · FPS 1/6</div>
    <h1><span class="hl">「1帧6秒」</span><br>讲解类视频压缩标准倡议</h1>
    <p class="tagline">画面每 6 秒只保留 1 帧,99 分钟视频压到 <b style="color:#a3e635">≈17.5MB</b> —— 8 级规范 · 9 大场景 · 禁用红线 · PPT 抗压缩设计</p>
    <div class="pills">
      <div class="pill">600 帧 / 小时</div>
      <div class="pill">8 级方案 <b>L1→L8</b></div>
      <div class="pill">9 大场景</div>
      <div class="pill">H.264 / AAC · 开源 CC BY 4.0</div>
    </div>
    <div class="foot">
      <span class="url">https://brnme.github.io/1f6s/</span>
      <span>v1.0 · 韩烈 与 AI 协作伙伴</span>
    </div>
  </div>
</body>
</html>
