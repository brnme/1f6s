<meta name="description" content="1f6s Studio——1帧6秒 HTML 幻灯片的导入、所见即所得编辑、源码编辑、规范体检、全屏播放与白板板书的单文件工具，零依赖。">
<style>
/* ===== 1f6s Studio 工作台样式（深色 / 黑白灰 + 青#22d3ee / 荧光绿#a3e635 / ≥2px 线宽 / 零阴影零渐变）===== */
:root{
  --bg:#0a0a0a; --panel:#111111; --panel2:#161616; --panel3:#1d1d1d;
  --border:#333333; --border2:#444444; --text:#e8e8e8; --muted:#9a9a9a;
  --cyan:#22d3ee; --lime:#a3e635; --red:#ef4444;
  --sans:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --mono:"Cascadia Code",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.5;overflow:hidden;}
button{font-family:inherit;font-size:inherit;color:inherit;background:var(--panel2);border:2px solid var(--border2);padding:6px 14px;cursor:pointer;border-radius:0;}
button:hover{border-color:var(--cyan);color:var(--cyan);}
button:active{background:var(--panel3);}
button.primary{background:var(--cyan);color:#000;border-color:var(--cyan);font-weight:700;}
button.primary:hover{background:#7ce4f5;color:#000;}
button.ghost{background:transparent;}
button:disabled{opacity:.4;cursor:not-allowed;border-color:var(--border2);color:var(--muted);}
input[type=checkbox]{accent-color:var(--cyan);width:15px;height:15px;vertical-align:-2px;}
input[type=range]{accent-color:var(--cyan);width:100%;}
select{font-family:inherit;font-size:inherit;background:var(--panel2);color:var(--text);border:2px solid var(--border2);padding:5px 8px;border-radius:0;}
select:hover{border-color:var(--cyan);}
textarea{font-family:var(--mono);font-size:12.5px;background:#0d0d0d;color:var(--text);border:2px solid var(--border);padding:12px;width:100%;height:100%;resize:none;line-height:1.55;tab-size:2;white-space:pre;overflow-wrap:normal;overflow:auto;}
textarea:focus,select:focus{outline:none;border-color:var(--cyan);}
a{color:var(--cyan);text-decoration:none;}
a:hover{text-decoration:underline;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#2e2e2e;border:2px solid var(--bg);}
::-webkit-scrollbar-track{background:var(--bg);}

/* ===== 首屏：导入中心 ===== */
#import-view{height:100vh;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:48px 24px 40px;}
.iv-head{width:100%;max-width:980px;display:flex;align-items:center;justify-content:space-between;margin-bottom:56px;}
.brand{display:flex;align-items:baseline;gap:10px;color:var(--text);text-decoration:none;}
.brand:hover{text-decoration:none;}
.brand b{font-size:22px;letter-spacing:.5px;}
.brand b em{font-style:normal;color:var(--cyan);}
.brand .brand-tag{font-size:12px;color:var(--muted);border-left:2px solid var(--border2);padding-left:10px;}
.iv-title{font-size:44px;font-weight:700;letter-spacing:1px;text-align:center;line-height:1.25;}
.iv-title span{color:var(--cyan);}
.iv-sub{color:var(--muted);font-size:15px;text-align:center;margin:14px 0 40px;max-width:640px;}
#dropzone{width:100%;max-width:980px;border:3px dashed #555;padding:52px 24px;text-align:center;cursor:pointer;background:var(--panel);}
#dropzone .dz-big{font-size:19px;font-weight:700;margin-bottom:8px;}
#dropzone .dz-sub{color:var(--muted);font-size:13px;}
#dropzone:hover,#dropzone.dragover{border:3px solid var(--cyan);background:#0d1a1e;}
#dropzone.dragover .dz-big{color:var(--cyan);}
.iv-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:32px 0 8px;}
.iv-actions button{padding:10px 20px;font-size:14px;}
#recents{width:100%;max-width:980px;margin-top:36px;}
#recents h2{font-size:15px;color:var(--muted);font-weight:700;border-bottom:2px solid var(--border);padding-bottom:8px;margin-bottom:4px;}
#recent-list{list-style:none;}
#recent-list li{display:flex;align-items:center;gap:14px;padding:10px 8px;border-bottom:2px solid #1c1c1c;}
#recent-list .r-name{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#recent-list .r-meta{color:var(--muted);font-size:12px;white-space:nowrap;}
#recent-list .r-open{padding:4px 12px;}
#recent-list .r-del{padding:4px 10px;color:var(--muted);border-color:transparent;background:transparent;}
#recent-list .r-del:hover{color:var(--red);border-color:var(--red);}
.iv-foot{margin-top:48px;color:#6f6f6f;font-size:12px;text-align:center;}
.iv-foot code{font-family:var(--mono);color:var(--muted);}

/* ===== 工作台布局 ===== */
#workspace{height:100vh;display:flex;flex-direction:column;}
#workspace[hidden]{display:none;}
#topbar{height:50px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:2px solid var(--border);}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0;}
.brand-mini{color:var(--text);font-weight:700;text-decoration:none;font-size:14px;white-space:nowrap;}
.brand-mini em{font-style:normal;color:var(--cyan);}
#doc-name{font-family:var(--mono);font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px;}
#dot{width:10px;height:10px;flex:none;border-radius:50%;background:var(--red);visibility:hidden;}
#dot.on{visibility:visible;}
.tb-modes{display:flex;gap:0;margin-left:auto;margin-right:auto;}
.tb-modes button{border-right-width:0;padding:6px 22px;}
.tb-modes button:first-child{border-top-left-radius:0;}
.tb-modes button:last-child{border-right-width:2px;}
.tb-modes button.on{background:var(--cyan);color:#000;border-color:var(--cyan);font-weight:700;}
.tb-actions{display:flex;align-items:center;gap:8px;}
.tb-actions .mini{padding:5px 12px;font-size:12.5px;}
#chk-autosave{display:none;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;}
#chk-autosave.show{display:flex;}
#main{flex:1;display:grid;grid-template-columns:236px 1fr 296px;min-height:0;}

/* 左：页面列表 */
#pagebar{background:var(--panel);border-right:2px solid var(--border);display:flex;flex-direction:column;min-height:0;}
#page-list{list-style:none;flex:1;overflow-y:auto;padding:6px 0;}
.pg-item{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 13px;cursor:pointer;border-left:3px solid transparent;user-select:none;}
.pg-item:hover{background:var(--panel2);}
.pg-item.cur{background:var(--panel2);border-left-color:var(--cyan);}
.pg-item.cur .pg-num{color:var(--cyan);}
.pg-num{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:none;width:22px;text-align:right;}
.pg-ttl{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pg-badge{flex:none;font-size:10px;padding:1px 6px;border:2px solid var(--border2);color:var(--muted);}
.pg-badge.b-dark{color:var(--text);border-color:#777;}
.pg-badge.b-cover{color:var(--cyan);border-color:var(--cyan);}
.pg-badge.b-code{color:var(--lime);border-color:var(--lime);}
.pg-btns{display:none;flex:none;gap:2px;}
.pg-item:hover .pg-btns{display:flex;}
.pg-btns button{padding:0 6px;font-size:11px;background:transparent;border-color:transparent;color:var(--muted);line-height:1.5;}
.pg-btns button:hover{color:var(--cyan);border-color:var(--cyan);}
.pg-drop{height:0;border-top:3px solid var(--cyan);}
.pb-foot{flex:none;padding:10px;border-top:2px solid var(--border);}
.pb-foot button{width:100%;}

/* 中：舞台 */
#stage{position:relative;background:#000;min-width:0;min-height:0;display:flex;flex-direction:column;}
#deck-frame{flex:1;width:100%;border:none;background:#fff;}
#stage-hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--panel);border:2px solid var(--border2);color:var(--muted);padding:6px 14px;font-size:12px;pointer-events:none;white-space:nowrap;}
#source-panel{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);}
#source-panel.show{display:flex;}
.sp-tabs{display:flex;gap:0;padding:10px 12px 0;flex:none;}
.sp-tabs button{border-bottom-width:0;padding:7px 18px;font-size:12.5px;}
.sp-tabs button.on{background:#0d0d0d;color:var(--cyan);border-color:var(--border2);font-weight:700;}
.sp-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px;gap:10px;}
.sp-body textarea{flex:1;min-height:0;}
.sp-foot{display:flex;gap:10px;align-items:center;flex:none;}
.sp-msg{color:var(--muted);font-size:12px;}

/* 右：检查器 */
#inspector{background:var(--panel);border-left:2px solid var(--border);overflow-y:auto;padding:14px;min-height:0;}
.insp-sec{border:2px solid var(--border);padding:12px;margin-bottom:12px;}
.insp-sec>h3{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.insp-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.insp-row:last-child{margin-bottom:0;}
.insp-row label{color:var(--muted);font-size:12px;flex:none;}
.seg{display:flex;flex-wrap:wrap;gap:0;}
.seg button{border-right-width:0;padding:5px 10px;font-size:12px;}
.seg button:last-child{border-right-width:2px;}
.seg button.on{background:var(--cyan);color:#000;border-color:var(--cyan);font-weight:700;}
.swrow{display:flex;gap:8px;}
.swatch{width:26px;height:26px;border:2px solid var(--border2);cursor:pointer;padding:0;}
.swatch.on{border-color:var(--cyan);outline:2px solid var(--cyan);outline-offset:1px;}
.hint{color:#7d7d7d;font-size:11.5px;line-height:1.5;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.bar-row .bar-idx{font-family:var(--mono);font-size:11px;color:var(--muted);width:20px;flex:none;}
.bar-row input[type=range]{flex:1;min-width:0;}
.bar-row .bar-val{font-family:var(--mono);font-size:11px;color:var(--cyan);width:38px;flex:none;text-align:right;}
.bar-row button{padding:2px 8px;font-size:11px;flex:none;}
.lint-item{display:block;width:100%;text-align:left;background:transparent;border:none;border-bottom:2px solid #1e1e1e;padding:8px 4px;cursor:pointer;font-size:12px;line-height:1.45;}
.lint-item:hover{border-color:var(--cyan);}
.lint-item .li-t{font-weight:700;}
.lint-item .li-d{color:var(--muted);}
.lint-ok{color:var(--lime);font-weight:700;padding:8px 4px;}
.lint-bad{color:var(--red);font-weight:700;padding:8px 4px;}
.wide{width:100%;}

/* ===== 播放模式（body.playing 收起全部工作台 chrome，舞台全屏）===== */
body.playing #topbar,body.playing #pagebar,body.playing #inspector{display:none;}
body.playing #main{display:block;}
body.playing #stage{position:fixed;inset:0;z-index:200;}
body.playing #stage-hint,body.playing #source-panel{display:none !important;}

/* ===== 对话框 / 提示 ===== */
.dlg-wrap{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:300;}
.dlg-wrap.show{display:flex;}
.dlg{background:var(--panel2);border:2px solid var(--border2);min-width:380px;max-width:720px;max-height:84vh;overflow-y:auto;padding:20px;}
.dlg h2{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--text);}
.dlg h2 span{color:var(--cyan);}
.dlg-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
#dlg-paste textarea{height:260px;white-space:pre-wrap;font-size:12px;}
.tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.tpl-card{background:var(--panel);border:2px solid var(--border2);padding:12px;cursor:pointer;text-align:left;}
.tpl-card:hover{border-color:var(--cyan);}
.tpl-card b{display:block;font-size:13.5px;margin-bottom:4px;color:var(--cyan);}
.tpl-card span{font-size:11.5px;color:var(--muted);line-height:1.4;display:block;}
#dlg-export .opt-row{display:flex;align-items:center;gap:8px;padding:6px 0;}
#dlg-export .opt-row label{cursor:pointer;}
#toasts{position:fixed;right:18px;bottom:18px;z-index:400;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.toast{background:var(--panel2);border:2px solid var(--border2);border-left:3px solid var(--cyan);padding:9px 14px;font-size:12.5px;max-width:380px;}
.toast.ok{border-left-color:var(--lime);}
.toast.err{border-left-color:var(--red);}
kbd{font-family:var(--mono);font-size:11px;background:var(--panel3);border:1px solid #555;padding:1px 6px;color:var(--text);white-space:nowrap;}
.help-tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.help-tbl td{border-bottom:2px solid #1e1e1e;padding:7px 6px;}
.help-tbl td:first-child{width:150px;}
.help-tbl h4{margin:12px 0 6px;color:var(--cyan);font-size:12.5px;}

/* 窄屏：检查器收起 */
@media (max-width:1080px){
  #main{grid-template-columns:210px 1fr;}
  #inspector{display:none;}
  #inspector.force{display:block;position:fixed;right:0;top:50px;bottom:0;z-index:150;width:296px;}
}
</style>

<script>
(function(){
'use strict';
var $=function(s,c){return (c||document).querySelector(s);};
var $$=function(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s));};

/* ================= i18n ================= */
var I18N={};
try{I18N=JSON.parse($('#i18n-data').textContent);}catch(e){console.warn('i18n parse fail',e);}
var LANG=(/\/en\//.test(location.pathname)||/[?&]lang=en\b/.test(location.search))?'en':'zh';
document.documentElement.lang=(LANG==='en')?'en':'zh-CN';
function t(k){var d=I18N[LANG]||{},z=I18N.zh||{};return d[k]||z[k]||k;}
function applyStatic(){
  $$('[data-i18n]').forEach(function(el){el.innerHTML=t(el.getAttribute('data-i18n'));});
  $$('[data-i18n-ph]').forEach(function(el){el.placeholder=t(el.getAttribute('data-i18n-ph'));});
  if(t('page.title'))document.title=t('page.title');
}

/* ================= 全局状态 ================= */
var S={src:'',name:'',handle:null,dirty:false,mode:'edit',cur:0,sel:null,
       undo:[],redo:[],boards:null,hasWb:false,lastPush:0};
var frame=$('#deck-frame'),blobUrl=null,saveT=null,selStyleVer=0;
function fd(){return frame.contentDocument;}

function toast(msg,err,ok){var d=document.createElement('div');d.className='toast'+(err?' err':(ok?' ok':''));d.textContent=msg;
  $('#toasts').appendChild(d);setTimeout(function(){d.remove();},err?5000:2400);}
function confirmDlg(title,msg,cb){$('#cf-title').textContent=title;$('#cf-msg').textContent=msg;
  var w=$('#dlg-confirm');w.classList.add('show');
  var ok=$('#cf-ok');var done=function(v){w.classList.remove('show');ok.onclick=null;w.onclick=null;if(v)cb();};
  ok.onclick=function(){done(true);};w.onclick=function(e){if(e.target===w)done(false);};
  w.querySelectorAll('[data-close]').forEach(function(b){b.onclick=function(){done(false);};});}

/* ================= 源文本唯一真相源：section 切片与替换 ================= */
var SEC_RE=/<section\b[^>]*>|<\/section>/g;
function slideSpans(src){
  var out=[],m,stack=[];SEC_RE.lastIndex=0;
  while((m=SEC_RE.exec(src))){
    if(m[0]==='</section>'){
      var open=stack.pop();
      if(open===undefined)continue;
      if(!stack.length){
        var tag=src.slice(open,m.index);
        if(/class="[^"]*\bslide\b/.test(tag))
          out.push({start:open,end:SEC_RE.lastIndex,html:src.slice(open,SEC_RE.lastIndex)});
      }
    }else stack.push(m.index);
  }
  return out;
}
function replaceSlide(i,html){
  var sp=slideSpans(S.src);
  if(!sp[i])return false;
  S.src=S.src.slice(0,sp[i].start)+html+S.src.slice(sp[i].end);
  return true;
}
function setActiveOnly(html,on){
  return html.replace(/<section\b[^>]*class="[^"]*"/,function(tag){
    return tag.replace(/class="([^"]*)"/,function(m,c){
      c=c.replace(/\s*\bactive\b/g,'').trim();
      if(on)c=(c?c+' ':'')+'active';
      return 'class="'+c+'"';
    });
  });
}
/* 全 deck 仅首页保留 active（deck 自带脚本加载时会 show(0)） */
function normalizeActive(src){
  var sp=slideSpans(src);
  sp.forEach(function(x,i){src=src.slice(0,x.start)+setActiveOnly(x.html,i===0)+src.slice(x.end);});
  return src;
}

/* ================= 撤销 / 重做 ================= */
function pushUndo(){
  var now=Date.now();
  if(S.undo.length&&now-S.lastPush<900){S.lastPush=now;S.redo.length=0;return;}
  S.undo.push(S.src);if(S.undo.length>80)S.undo.shift();
  S.redo.length=0;S.lastPush=now;
}
function doUndo(){if(!S.undo.length)return;pushNow(S.redo,S.src);S.src=S.undo.pop();afterSrcChange();}
function doRedo(){if(!S.redo.length)return;pushNow(S.undo,S.src);S.src=S.redo.pop();afterSrcChange();}
function pushNow(arr,v){arr.push(v);if(arr.length>80)arr.shift();}

/* ================= 白板注入块（版本标记，导出可再注入） ================= */
var WB_START='<!--1f6s-wb:start:v1-->',WB_END='<!--1f6s-wb:end-->';
function stripWbBlock(src){
  var i=src.indexOf(WB_START);
  if(i<0)return src;
  var j=src.indexOf(WB_END,i);
  return j<0?src:(src.slice(0,i)+src.slice(j+WB_END.length));
}
function extractWb(src){
  S.boards=null;S.hasWb=false;
  var i=src.indexOf(WB_START);
  if(i<0)return;
  var j=src.indexOf(WB_END,i);if(j<0)return;
  var blk=src.slice(i,j);
  var m=blk.match(/\/\*WB-DATA\*\/([\s\S]*?)\/\*END\*\//);
  if(m){
    try{S.boards=JSON.parse(m[1]);}catch(e){}
  }
  S.hasWb=true;
}

/* ================= 未保存标记 / 自动保存 ================= */
function markDirty(){
  if(!S.dirty){S.dirty=true;$('#dot').classList.add('on');}
  if($('#autosave').checked&&S.handle){clearTimeout(saveT);saveT=setTimeout(function(){doSave(true);},2000);}
}
function clearDirty(){S.dirty=false;$('#dot').classList.remove('on');}

/* ================= 导入 ================= */
function openFromText(name,src,handle,silentAddRecent){
  if(!src||src.length<40){toast(t('toast.badfile'),1);return;}
  var isSlide=/class="[^"]*\bslide\b/.test(src);
  var go=function(){
    S.name=name||'deck.html';S.handle=handle||null;
    S.undo=[];S.redo=[];S.cur=0;S.sel=null;
    extractWb(src);
    S.src=normalizeActive(stripWbBlock(src));
    $('#import-view').style.display='none';
    $('#workspace').hidden=false;
    $('#doc-name').textContent=S.name;
    $('#chk-autosave').classList.toggle('show',!!S.handle);
    clearDirty();
    renderPages();rebuildFrame();
    if(!silentAddRecent)addRecent(S.name,S.src);
  };
  if(isSlide)go();
  else confirmDlg(t('cf.notslide.t'),t('cf.notslide.m'),go);
}
async function openViaPicker(){
  if(window.showOpenFilePicker){
    try{
      var hs=await window.showOpenFilePicker({types:[{description:'HTML deck',accept:{'text/html':['.html','.htm']}}]});
      var h=hs[0],f=await h.getFile();
      openFromText(f.name,await f.text(),h);
      return;
    }catch(e){if(e&&e.name==='AbortError')return;console.warn(e);}
  }
  $('#file-input').click();
}
function readFileInput(file){
  if(!file)return;
  var r=new FileReader();
  r.onload=function(){openFromText(file.name,String(r.result),null);};
  r.readAsText(file,'utf-8');
}

/* 最近打开（本机快照） */
function recents(){try{return JSON.parse(localStorage.getItem('studio.recents')||'[]');}catch(e){return[];}}
function addRecent(name,snap){
  var r=recents().filter(function(x){return x.name!==name;});
  r.unshift({name:name,ts:Date.now(),snap:snap});
  if(r.length>6)r.length=6;

function fmtAgo(ts){
  var m=Math.floor((Date.now()-ts)/60000);

  if(m<60)return m+(LANG==='en'?' min ago':' 分钟前');
  var h=Math.floor(m/60);if(h<24)return h+(LANG==='en'?' h ago':' 小时前');
  return new Date(ts).toLocaleDateString();
}

/* ================= iframe 舞台 ================= */
function rebuildFrame(){
  if(blobUrl)URL.revokeObjectURL(blobUrl);
  blobUrl=URL.createObjectURL(new Blob([S.src],{type:'text/html'}));
  frame.onload=onFrameLoad;
  frame.src=blobUrl;
}
function slidesEls(){var d=fd();return d?$$('.slide',d):[];}
function applyActive(){
  var els=slidesEls(),d=fd();
  els.forEach(function(el,i){el.classList.toggle('active',i===S.cur);});
  var c=d&&d.getElementById('cur'),tt=d&&d.getElementById('total');
  if(c)c.textContent=S.cur+1;if(tt)tt.textContent=els.length;

function injectSelStyle(d){
  if(d.getElementById('studio-sel-style'))return;

  st.textContent='.studio-sel{outline:4px solid #22d3ee !important;outline-offset:3px;}'+
    '.studio-flash{outline:8px solid #22d3ee !important;outline-offset:4px;}';

function onFrameLoad(){
  var d=fd();if(!d)return;
  selStyleVer++;
  injectSelStyle(d);
  d.addEventListener('keydown',function(e){
    if(S.mode!=='play'){
      var k=e.key;
      if(k==='ArrowLeft'||k==='ArrowRight'||k==='PageUp'||k==='PageDown'||k==='Home'||k==='End'||k===' '){
        e.stopImmediatePropagation();e.preventDefault();

/* ================= 选中与就地编辑 ================= */
function pathOf(root,el){
  var p=[];
  while(el&&el!==root){
    var par=el.parentElement;
    if(!par)return null;
    p.unshift(Array.prototype.indexOf.call(par.children,el));
    el=par;
  }
  return el===root?p:null;
}
function resolvePath(root,path){
  var el=root;
  try{for(var i=0;i<path.length;i++)el=el.children[path[i]];}catch(e){return null;}
  return (el&&root.contains(el))?el:null;
}
function selEl(){
  if(!S.sel)return null;
  var els=slidesEls(),sec=els[S.sel.slide];
  return sec?resolvePath(sec,S.sel.path):null;
}
function clearSel(){S.sel=null;var d=fd();
  if(d)$$('.studio-sel',d).forEach(function(el){el.classList.remove('studio-sel');});}
function onFrameClick(e){
  if(S.mode!=='edit')return;
  var el=e.target;if(!el||!el.closest)return;
  var sec=el.closest('.slide');if(!sec)return;
  e.preventDefault();
  S.cur=slidesEls().indexOf(sec);
  applyActive();renderPages();
  var d=fd();
  $$('.studio-sel',d).forEach(function(x){x.classList.remove('studio-sel');});
  if(el!==sec){
    S.sel={slide:S.cur,path:pathOf(sec,el)};
    el.classList.add('studio-sel');
  }else S.sel=null;
  renderInspector();
}
function onFrameDblClick(e){
  if(S.mode!=='edit')return;
  var el=e.target,sec=el&&el.closest?el.closest('.slide'):null;
  if(!sec||el===sec)return;
  if(!S.sel||S.sel.slide!==slidesEls().indexOf(sec)||selEl()!==el){
    S.sel={slide:slidesEls().indexOf(sec),path:pathOf(sec,el)};
  }
  e.preventDefault();
  el.setAttribute('contenteditable','true');
  el.focus();
  try{
    var rg=fd().createRange();rg.selectNodeContents(el);rg.collapse(false);
    var sels=fd().getSelection();sels.removeAllRanges();sels.addRange(rg);
  }catch(e2){}
  var done=function(){
    el.removeEventListener('blur',done);
    el.removeAttribute('contenteditable');
    var i=slidesEls().indexOf(sec);
    var before=slideSpans(S.src)[i];
    var after=sec.outerHTML;
    if(before&&before.html!==after){pushUndo();replaceSlide(i,after);markDirty();renderPages();}
  };
  el.addEventListener('blur',done);
}
/* 外科回写：把 iframe 中某 section 的当前 DOM 写回源文本 */
function commitSection(sec){
  var i=slidesEls().indexOf(sec);
  if(i<0)return;
  pushUndo();
  replaceSlide(i,sec.outerHTML);
  markDirty();
  renderPages();
}

function slideTitle(sec){

function renderPages(){
  var els=slidesEls(),ol=$('#page-list');ol.innerHTML='';

    li.querySelector('.pg-num').textContent=i+1;

    li.addEventListener('dragover',function(ev){if(ev.dataTransfer.types.indexOf('text/studio-page')>=0){ev.preventDefault();li.style.borderTop='3px solid #22d3ee';}});
    li.addEventListener('dragleave',function(){li.style.borderTop='';});
    li.addEventListener('drop',function(ev){
      ev.preventDefault();li.style.borderTop='';

      if(!isNaN(from))moveSlide(from,i);

function withSpans(mut){
  pushUndo();
  var sp=slideSpans(S.src);
  var res=mut(sp);
  if(res===false)return;
  S.src=normalizeActive(res);
  afterSrcChange();
}
function afterSrcChange(){
  clearSel();
  rebuildFrame();
  renderInspector();
}
function pageAct(act,i){
  if(act==='del'){
    if(slidesEls().length<=1){toast(t('toast.lastpage'),1);return;}
    confirmDlg(t('pp.del'),t('pp.delm').replace('{n}',i+1),function(){delSlide(i);});
    return;
  }
  if(act==='dup')withSpans(function(sp){
    var h=setActiveOnly(sp[i].html,false);
    return S.src.slice(0,sp[i].end)+'\n\n  '+h+S.src.slice(sp[i].end);
  }),S.cur=i+1;
  if(act==='up'&&i>0)moveSlide(i,i-1);
  if(act==='down'&&i<slidesEls().length-1)moveSlide(i,i+1);
}
function delSlide(i){
  withSpans(function(sp){return S.src.slice(0,sp[i].start)+S.src.slice(sp[i].end);});
  if(S.cur>=slidesEls().length)S.cur=Math.max(0,slidesEls().length-1);
}
function moveSlide(from,to){
  if(from===to)return;
  withSpans(function(sp){
    var h=sp[from].html;
    var src=S.src.slice(0,sp[from].start)+S.src.slice(sp[from].end);
    var sp2=slideSpans(src);
    var at=to>from?sp2[to-1]?sp2[to-1].end:src.length:(sp2[to]?sp2[to].start:src.length);
    S.cur=to;
    return src.slice(0,at)+'\n\n  '+h+src.slice(at);
  });
}
function insertSlideAt(html,afterIdx){
  withSpans(function(sp){
    var at=(afterIdx>=0&&sp[afterIdx])?sp[afterIdx].end:(sp[0]?sp[0].start:S.src.length);
    return S.src.slice(0,at)+'\n\n  '+html+S.src.slice(at);
  });
  S.cur=afterIdx+1;
}

/* ================= 规范体检（对照 1f6s 设计硬约束） ================= */
function hexOf(c){
  var m=c&&c.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
  if(!m)return null;
  var h=(parseInt(m[1],10)<<16|parseInt(m[2],10)<<8|parseInt(m[3],10)).toString(16);
  while(h.length<6)h='0'+h;return h;
}
var OK_COLORS={'000000':1,'808080':1,'ffffff':1};
function lint(){
  var d=fd();if(!d)return[];
  var v=d.defaultView,out=[];
  function ownText(e){
    for(var n=e.firstChild;n;n=n.nextSibling)
      if(n.nodeType===3&&n.textContent.trim())return true;
    return false;
  }
  slidesEls().forEach(function(sec,si){
    [sec].concat($$('*',sec)).forEach(function(e){
      var cs=v.getComputedStyle(e),desc=(e.tagName.toLowerCase()+(e.className&&typeof e.className==='string'?'.'+e.className.split(/\s+/).slice(0,2).join('.'):''));
      /* 字号：有直接文本的元素 ≥28px（模板最小档） */
      if(ownText(e)&&parseFloat(cs.fontSize)<28)
        out.push({s:si,e:e,m:t('lint.size').replace('{v}',cs.fontSize),d:desc});
      /* 文字颜色三色 */
      var tc=hexOf(cs.color);
      if(tc&&!OK_COLORS[tc])out.push({s:si,e:e,m:t('lint.color')+' #'+tc,d:desc});
      /* 背景三色 + 渐变 */
      var bgm=cs.backgroundImage;
      if(bgm&&bgm!=='none'){
        if(bgm.indexOf('repeating-linear-gradient')<0)
          out.push({s:si,e:e,m:t('lint.gradient'),d:desc});
      }else{
        var bc=hexOf(cs.backgroundColor);
        if(bc&&!OK_COLORS[bc])out.push({s:si,e:e,m:t('lint.bg')+' #'+bc,d:desc});
      }
      /* 边框 ≥3px */
      ['Top','Right','Bottom','Left'].forEach(function(side){
        if(cs['border'+side+'Style']!=='none'&&parseFloat(cs['border'+side+'Width'])<3)
          out.push({s:si,e:e,m:t('lint.thin').replace('{v}',cs['border'+side+'Width']),d:desc+' '+side.toLowerCase()});
      });
      /* 边框颜色三色 */
      var boc=hexOf(cs.borderTopColor);
      if(cs.borderTopStyle!=='none'&&boc&&!OK_COLORS[boc])
        out.push({s:si,e:e,m:t('lint.bcolor')+' #'+boc,d:desc});
      /* 阴影 */
      if(cs.boxShadow&&cs.boxShadow!=='none')out.push({s:si,e:e,m:t('lint.shadow'),d:desc});
      if(cs.textShadow&&cs.textShadow!=='none')out.push({s:si,e:e,m:t('lint.tshadow'),d:desc});
      /* 衬线字体 */
      var ff=cs.fontFamily||'';
      if(ff.indexOf('sans-serif')<0&&/serif|宋体|楷体|Times|Song|Kai/i.test(ff))
        out.push({s:si,e:e,m:t('lint.serif'),d:desc});
    });
  });
  return out;
}
function runLint(){
  var res=lint(),lb=$('#lint-body');if(!lb)return;
  if(!res.length){lb.innerHTML='<p class="lint-ok">'+t('lint.ok')+'</p>';toast(t('lint.ok'),0,1);return;}
  lb.innerHTML='<p class="lint-bad">'+t('lint.bad').replace('{n}',res.length)+'</p>';
  res.slice(0,60).forEach(function(r){
    var b=document.createElement('button');b.className='lint-item';
    b.innerHTML='<span class="li-t">'+esc(t('insp.slide').replace('{n}',r.s+1))+' · '+esc(r.m)+'</span><br><span class="li-d">'+esc(r.d)+'</span>';
    b.onclick=function(){
      S.cur=r.s;clearSel();applyActive();renderPages();
      try{r.e.scrollIntoView({block:'center'});r.e.classList.add('studio-flash');
        setTimeout(function(){r.e.classList.remove('studio-flash');},900);}catch(e){}
    };
    lb.appendChild(b);
  });

/* ================= 源码模式 ================= */
var spTab='page';
function spOrig(){
  if(spTab==='page'){var sp=slideSpans(S.src);return sp[S.cur]?sp[S.cur].html:'';}
  if(spTab==='doc')return S.src;
  var i=S.src.indexOf('<style>'),j=S.src.indexOf('</style>');
  return (i>=0&&j>i)?S.src.slice(i+7,j):'';
}
function spFill(){
  var ta=$('#src-ta');
  if(spTab==='page'){
    var sp=slideSpans(S.src);
    ta.value=sp[S.cur]?sp[S.cur].html:'';
  }else if(spTab==='doc')ta.value=S.src;
  else{
    var i=S.src.indexOf('<style>'),j=S.src.indexOf('</style>');
    ta.value=(i>=0&&j>i)?S.src.slice(i+7,j):'';
  }
}
function spApply(){
  var v=$('#src-ta').value;
  if(spTab==='page'){
    if(!/^<section\b/.test(v.trim())){toast(t('toast.notsection'),1);return;}
    pushUndo();
    if(!replaceSlide(S.cur,v.trim())){toast(t('toast.notsection'),1);return;}
    afterSrcChange();
  }else if(spTab==='doc'){
    pushUndo();S.src=v;afterSrcChange();
  }else{
    var i=S.src.indexOf('<style>'),j=S.src.indexOf('</style>');
    if(i<0||j<0){toast(t('toast.nostyle'),1);return;}
    pushUndo();S.src=S.src.slice(0,i+7)+v+S.src.slice(j);afterSrcChange();
  }
  toast(t('toast.applied'),0,1);
}
function setMode(m){
  var prev=S.mode;
  if(prev==='source'&&m!=='source'){
    if($('#src-ta').value!==spOrig())spApply();
  }
  S.mode=m;
  $('#mode-edit').classList.toggle('on',m==='edit');
  $('#mode-source').classList.toggle('on',m==='source');
  $('#mode-play').classList.toggle('on',m==='play');
  $('#source-panel').classList.toggle('show',m==='source');
  if(m==='source')spFill();
  if(m==='play'&&prev!=='play')enterPlay();
  if(m!=='play'&&prev==='play')exitPlay();
}

/* ================= 保存 / 导出 ================= */
function wbPref(){return S.hasWb||collectBoards().length>0||($('#exp-wb').checked);}
function buildExport(withWb){
  var src=stripWbBlock(S.src);
  if(withWb){
    var data=JSON.stringify(collectBoards()||[]);
    /* 注意：数据必须落成 var 语句——裸数组字面量换行接 (function…) 会被
       ASI 连缀成「数组当函数调用」，独立运行时第一行即抛错 */
    var block=WB_START+'\n<script>var __WB_DATA__=/*WB-DATA*/'+data+'/*END*/;\n('+WBMAIN.toString()+')(__WB_DATA__)\n</'+'script>\n'+WB_END;
    src=src.replace('</body>',block+'</body>');
    if(src.indexOf(WB_START)<0)src+=block; /* 无 </body> 的极端 deck：追加尾部 */
  }
  return src;
}
async function doSave(quiet){
  if(!S.handle){openExportDlg();return;}
  try{
    var w=await S.handle.createWritable();
    await w.write(buildExport(wbPref()));
    await w.close();
    clearDirty();S.hasWb=wbPref();
    if(!quiet)toast(t('toast.saved'),0,1);
  }catch(e){toast(t('toast.savefail')+String(e&&e.message||e),1);}
}
function downloadBlob(){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([buildExport(wbPref())],{type:'text/html'}));
  a.download=S.name||'deck.html';a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
}
async function saveAs(){
  if(window.showSaveFilePicker){
    try{
      var h=await window.showSaveFilePicker({suggestedName:S.name,types:[{description:'HTML deck',accept:{'text/html':['.html','.htm']}}]});
      var w=await h.createWritable();await w.write(buildExport(wbPref()));await w.close();
      S.handle=h;S.name=h.name;$('#doc-name').textContent=S.name;clearDirty();
      $('#chk-autosave').classList.add('show');
      toast(t('toast.saved'),0,1);return;
    }catch(e){if(e&&e.name==='AbortError')return;console.warn(e);}
  }
  downloadBlob();
}
function openExportDlg(){
  $('#exp-name').textContent=S.name||'';
  var cb=$('#exp-wb');cb.checked=S.hasWb;
  $('#exp-wb-note').hidden=!S.hasWb;
  $('#exp-write').disabled=!S.handle;
  $('#dlg-export').classList.add('show');
}
/* ================= 白板运行时 =================

    '#wb-bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:9999;display:none;gap:4px;align-items:center;padding:8px 12px;background:#111;border:2px solid #fff;border-radius:26px;}'+

      b.items.push(it);it.__el=svg;svg.__it=it;
      persist();
    }
    W.addEventListener('pointermove',mv);W.addEventListener('pointerup',up);
  }
  function curBoard(){var a=els();return boardOf(a[curIdx()]);}
  function wbUndo(){
    var b=curBoard();if(!b||!b.items.length)return;
    var it=b.items.pop();
    if(it.__el)it.__el.remove();
    persist();
  }
  function clearBoard(){
    var b=curBoard();if(!b)return;
    b.items=[];
    var sec=boardSec(b);
    if(sec)Array.prototype.slice.call(sec.children).forEach(function(ch){
      if(ch.classList&&(ch.classList.contains('wb-t')||ch.classList.contains('wb-svg')))ch.remove();
    });
    persist();
  }
  function delBoard(){
    var b=curBoard();if(!b)return;
    var a=els(),i=curIdx(),prevNormal=i;
    for(var j=i-1;j>=0;j--)if(!isBoard(a[j])){prevNormal=j;break;}
    BOARDS=BOARDS.filter(function(x){return x!==b;});
    renderBoards();persist();
    var a2=els();
    show(Math.min(prevNormal,a2.length-1));
  }
  /* ---- 工具条 ---- */
  function buildBar(){
    var bar=D.createElement('div');bar.id='wb-bar';
    function btn(label,title){var x=D.createElement('button');x.textContent=label;x.title=title;x.type='button';bar.appendChild(x);return x;}
    var toolBtns={};
    [['move','✥','移动 / 拖拽'],['type','T','打字（点击落文本框）'],['pen','✎','画笔'],['line','╱','直线']]
      .forEach(function(d){toolBtns[d[0]]=btn(d[1],d[2]);toolBtns[d[0]].onclick=function(){state.tool=d[0];refresh();};});
    var sep=function(){var s=D.createElement('span');s.style.cssText='width:2px;height:26px;background:#444;margin:0 4px;';bar.appendChild(s);};
    sep();
    var colBtns=COLORS.map(function(c,i){
      var x=btn('',c==='#FFFFFF'?'白':(c==='#000000'?'黑':(c==='#22d3ee'?'青':'绿')));
      x.className='wb-sw';x.style.background=c;
      x.onclick=function(){state.c=i;refresh();};
      return x;
    });
    sep();
    var wBtns=[4,6,10,16].map(function(w){
      var x=btn(String(w),w+'px');x.onclick=function(){state.sw=w;refresh();};return x;
    });
    sep();
    var dBtns=[['solid','─','实线'],['dashed','╌','虚线'],['dashdot','−·','点划线']].map(function(d){
      var x=btn(d[1],d[2]);x.onclick=function(){state.dash=d[0];refresh();};return x;
    });
    sep();
    var aMin=btn('A−','缩小选中/新文本字号'),aPlus=btn('A+','放大选中/新文本字号');
    function fsAdj(d){
      if(state.selBox&&state.selBox.__it){
        var it=state.selBox.__it;
        it.fs=Math.max(28,Math.min(72,it.fs+d));
        state.selBox.style.fontSize=it.fs+'px';persist();
      }else state.fs=Math.max(28,Math.min(72,state.fs+d));
    }
    aMin.onclick=function(){fsAdj(-4);};aPlus.onclick=function(){fsAdj(4);};
    var bgB=btn('◐','切换板底（白/黑）');
    bgB.onclick=function(){
      var b=curBoard();
      state.bg=(state.bg==='w')?'b':'w';
      if(b){b.bg=state.bg;var sec=boardSec(b);
        if(sec){sec.style.background=(b.bg==='b')?'#000':'#fff';sec.style.color=(b.bg==='b')?'#fff':'#000';}}
      persist();
    };
    sep();
    var uB=btn('↶','撤销上一笔/上一框');uB.onclick=wbUndo;
    var cB=btn('⌫','清空本板');cB.onclick=clearBoard;
    var xB=btn('删板','删除这块白板页');xB.onclick=delBoard;
    function refresh(){
      for(var k in toolBtns)toolBtns[k].classList.toggle('on',state.tool===k);
      colBtns.forEach(function(x,i){x.classList.toggle('on',i===state.c);});
      wBtns.forEach(function(x,i){x.classList.toggle('on',[4,6,10,16][i]===state.sw);});
      dBtns.forEach(function(x,i){x.classList.toggle('on',['solid','dashed','dashdot'][i]===state.dash);});
    }
    D.body.appendChild(bar);
  }
  /* ---- init ---- */
  if(!BOARDS||!BOARDS.slice){
    try{BOARDS=JSON.parse(localStorage.getItem('1f6s-wb::'+(D.title||'deck'))||'[]');}
    catch(e){BOARDS=[];}
  }
  if(!BOARDS)BOARDS=[];
  uid=BOARDS.length?BOARDS.reduce(function(m,b){return Math.max(m,b.id||0);},0):Date.now();
  buildBar();renderBoards();
  var m=location.search.match(/[?&]s=(\d+)/);
  if(m)show(Math.max(0,parseInt(m[1],10)-1));
}

var playT=null,playStart=0,timerOn=true,ovEl=null;
function injectRuntime(d){

function enterPlay(){

  var st=$('#stage');
  try{if(st.requestFullscreen)st.requestFullscreen().catch(function(){});}catch(e){}

  injectRuntime(d);
  injectPlayExtras(d);
  try{frame.contentWindow.focus();}catch(e){}
}
function exitPlay(){
  S.boards=collectBoards();
  document.body.classList.remove('playing');
  ovEl=null;
  if(document.fullscreenElement){try{document.exitFullscreen();}catch(e){}}

function injectPlayExtras(d){
  var tm=d.createElement('div');tm.id='wb-timer';tm.textContent='00:00';
  tm.style.cssText='position:fixed;top:24px;right:28px;z-index:9998;font:700 28px/1.4 monospace;color:#fff;background:#000;border:3px solid #fff;padding:4px 14px;';
  d.body.appendChild(tm);
  d.addEventListener('keydown',function(e){
    var k=e.key,tg=e.target;
    var typing=tg&&(tg.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName));
    if(typing)return;
    if(k==='o'||k==='O'){e.stopImmediatePropagation();e.preventDefault();toggleOv(d);}
    else if(k==='?'){e.stopImmediatePropagation();e.preventDefault();showHelp();}
    else if(k==='t'||k==='T'){e.stopImmediatePropagation();e.preventDefault();timerOn=!timerOn;tm.style.display=timerOn?'block':'none';}
    else if(k==='r'||k==='R'){e.stopImmediatePropagation();e.preventDefault();playStart=Date.now();}
    else if(k==='Escape'){e.stopImmediatePropagation();e.preventDefault();if(ovEl)toggleOv(d);else setMode('edit');}
  },true);
  playStart=Date.now();timerOn=true;
  clearInterval(playT);
  playT=setInterval(function(){
    var dd=fd(),el=dd&&dd.getElementById('wb-timer');
    if(!el)return;
    var s=Math.floor((Date.now()-playStart)/1000);
    var mm=String(Math.floor(s/60)),ss=String(s%60);
    el.textContent=(mm.length<2?'0':'')+mm+':'+(ss.length<2?'0':'')+ss;
  },500);
}
function toggleOv(d){
  if(ovEl){ovEl.remove();ovEl=null;return;}
  ovEl=d.createElement('div');
  ovEl.style.cssText='position:fixed;inset:0;z-index:9997;background:rgba(0,0,0,.93);overflow-y:auto;padding:40px;display:flex;flex-wrap:wrap;gap:14px;align-content:flex-start;';
  var els=$$('.slide',d);
  els.forEach(function(sec,i){
    var b=d.createElement('button');
    b.type='button';
    b.style.cssText='display:block;width:300px;padding:18px 16px;text-align:left;background:#111;border:3px solid #444;color:#eee;font:700 15px/1.4 system-ui,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
    b.innerHTML='<span style="color:#22d3ee;">'+(i+1)+'</span> '+esc(slideTitle(sec));
    b.onclick=function(){

      if(w&&w.__wbJump)w.__wbJump(i);
      toggleOv(d);
    };
    ovEl.appendChild(b);
  });
  d.body.appendChild(ovEl);
}

  /* 源码面板 */
  $('#sp-tab-page').onclick=function(){setSpTab('page');};
  $('#sp-tab-doc').onclick=function(){setSpTab('doc');};
  $('#sp-tab-style').onclick=function(){setSpTab('style');};
  $('#sp-apply').onclick=spApply;
  $('#src-ta').addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();spApply();}
    e.stopPropagation();
  });
  /* 全局拖放 */
  document.addEventListener('dragover',function(e){e.preventDefault();});
  document.addEventListener('drop',function(e){
    e.preventDefault();
    var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(!f)return;
    var go=function(){var r=new FileReader();r.onload=function(){openFromText(f.name,String(r.result),null);};r.readAsText(f,'utf-8');};
    if(S.dirty&&!$('#workspace').hidden)confirmDlg(t('cf.open'),t('cf.openm'),go);
    else go();
  });
  /* 键盘 */
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')){e.preventDefault();if(!$('#workspace').hidden)doSave();return;}
    if(typingIn(e))return;
    if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')&&!e.shiftKey){if(!$('#workspace').hidden){e.preventDefault();doUndo();}return;}
    if((e.ctrlKey||e.metaKey)&&((e.key==='y'||e.key==='Y')||((e.key==='z'||e.key==='Z')&&e.shiftKey))){if(!$('#workspace').hidden){e.preventDefault();doRedo();}return;}
    if(e.key==='?'&&!$('#workspace').hidden){e.preventDefault();showHelp();}
  });
  window.addEventListener('beforeunload',function(e){if(S.dirty){e.preventDefault();e.returnValue='';}});
  /* 通用对话框关闭 */
  $$('.dlg-wrap').forEach(function(w){
    w.addEventListener('click',function(e){if(e.target===w&&w.id!=='dlg-confirm')w.classList.remove('show');});
    w.querySelectorAll('[data-close]').forEach(function(b){b.onclick=function(){w.classList.remove('show');};});
  });
}
function setSpTab(m){
  if(m!==spTab&&S.mode==='source'&&$('#src-ta').value!==spOrig())spApply();
  spTab=m;
  $('#sp-tab-page').classList.toggle('on',m==='page');
  $('#sp-tab-doc').classList.toggle('on',m==='doc');
  $('#sp-tab-style').classList.toggle('on',m==='style');
  spFill();
}
boot();
})();
</script>
</body>
</html>
